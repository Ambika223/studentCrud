<div class="container-fluid mt-5">
    <h1 style="background-color: thistle; padding: 4px;" class="text-center">Post Task</h1>
    <div class="row">

        <div class="col-md-8 offset-2">
            <div class="card shadow">
                <div class="card-body">
                    <h2>{{!isOnEditMode?'Add Post':'Update Post'}}</h2>
                    <div class="form-group">
                        <label for="">Post Title</label>
                        <input type="text" placeholder="Enter Post Title" class="form-control" #title>
                    </div>

                    <div class="form-group">
                        <label for="">Post Image</label>
                        <input type="text" placeholder="Enter Post image Url" class="form-control" #image>
                    </div>

                    <div class="form-group">
                        <label for="">Post Description</label>
                        <textarea name="" id="" class="form-control mb-3" rows="3" #description></textarea>
                    </div>

                    <div>
                        <button mat-raised-button color="primary" class="btn-block" *ngIf="!isOnEditMode"
                            (click)="onAddPost()">Add
                            Post</button>

                        <button mat-raised-button color="primary" class="btn-block" *ngIf="isOnEditMode"
                            (click)="onUpdatePost()"><mat-icon>update</mat-icon> Update
                            Post</button>

                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="row" *ngIf="postArr.length>0;else noPost">

        <div class="col-lg-3 col-md-6 mb-4 mt-4" *ngFor="let post of postArr; trackBy:trackById">
            <mat-card class="example-card h-100">
                <mat-card-header>
                    <!-- <div mat-card-avatar class="example-header-image"></div> -->
                    <!-- <h4>{{post.title}}</h4> -->

                    <mat-card-title class="font-weight-bold text-nowrap">{{post.title}}</mat-card-title>
                </mat-card-header>
                <img mat-card-image [src]="post.image" [alt]="post.title" [title]="post.title">
                <mat-card-content>
                    <p>
                        {{post.description}}
                    </p>
                </mat-card-content>
                <mat-card-actions class="d-flex justify-content-between mt-auto">
                    <button mat-button color="primary" (click)="onEdit(post)">Edit</button>
                    <button mat-button color="warn" (click)="onDelete(post)" [disabled]="post.isEditing">Delete</button>
                </mat-card-actions>
            </mat-card>

        </div>
    </div>
    <ng-template #noPost>
        <p class="alert alert-info text-center">No Post Found Yet</p>
    </ng-template>
</div>
