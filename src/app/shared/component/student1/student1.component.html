<div class="container">
    <h1 style="background-color:greenyellow;" class="text-center mt-5">Student Crud using CheckBox</h1>
    <div class="row">
        <div class="col-lg-4">
            <div class="card shadow border-0">
                <div class="card-body bg-light">
                    <h2 class="bg-success text-center">{{!isOnEditMode?"Add Student":"Update Student"}}</h2>

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" class="form-control" #name>
                    </div>
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" class="form-control" #age>
                    </div>

                    <div class="form-group">
                        <label for="course">Course</label>
                        <input type="text" class="form-control" #course>
                    </div>

                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" class="form-control" #city>
                    </div>


                    <div class="form-group">
                        <label for="Select Active">Select</label>
                        <select class="form-control" #isActive>
                            <option value="">Select Status</option>
                            <option value="Active">Active</option>
                            <option value="InActive">InActive</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button mat-flat-button color="primary" *ngIf="!isOnEditMode" class="btn-block"
                            (click)="onAddStd()">Add
                            Student</button>
                        <button mat-flat-button color="primary" *ngIf="isOnEditMode" class="btn-block"
                            (click)="onUpdateStd()">Update
                            student</button>
                    </div>

                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card mb-5 shadow">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover" *ngIf="studArr.length>0; else noStudents">
                            <thead class="font-weight-bold">
                                <tr>
                                    <th>Sr No</th>
                                    <th>Full Name</th>
                                    <th>Age</th>
                                    <th>Course</th>
                                    <th>City</th>
                                    <th>isActive</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let std of studArr; let i=index">
                                    <td>{{i+1}}</td>
                                    <td>{{std.name}}</td>
                                    <td>{{std.age}}</td>
                                    <td>{{std.course}}</td>
                                    <td>{{std.city}}</td>
                                    <td> <input type="checkbox" [checked]="std.isActive"><span class="badge ml-4"
                                            (click)="onchange(std)" [ngClass]="{
                            'badge-success': std.isActive,
                            'badge-danger':!std.isActive
                            }">{{std.isActive?'Active':'InActive'}}</span>
                                    </td>

                                    <td><button class="btn btn-sm btn-outline-primary btn-block"
                                            (click)="onEditStd(std)">Edit</button></td>
                                    <td><button class="btn btn-sm btn-outline-danger btn-block"
                                            (click)="onRemoveStd(std)">Delete</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <ng-template #noStudents>
                        <p class="alert alert-info text-center">No Student Found</p>
                    </ng-template>
                </div>
            </div>
        </div>

    </div>
</div>
